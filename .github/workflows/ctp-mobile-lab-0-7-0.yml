name: CTP Mobile Lab 0.8.5 Android build

on:
  push:
    paths:
      - "CTP321AndroidStarter_0.7.0/**"
      - "tests/**"
      - "docs/**"
      - ".github/workflows/ctp-mobile-lab-0-7-0.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: CTP321AndroidStarter_0.7.0
        run: gradle --no-daemon assembleDebug

      - name: Verify APK and critical editor features
        shell: bash
        run: |
          set -euo pipefail
          APK="CTP321AndroidStarter_0.7.0/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK"
          unzip -l "$APK" | grep -q 'classes.dex'
          SRC="CTP321AndroidStarter_0.7.0/app/src/main/java/ru/ctplab/android/MainActivity.kt"
          grep -q 'private fun undoLastEdit()' "$SRC"
          grep -q 'private fun redoLastEdit()' "$SRC"
          grep -q 'private fun copyRawMap(' "$SRC"
          grep -q 'private fun pasteRawMap(' "$SRC"
          echo "APK archive and required editor features verified."
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CTP-Mobile-Lab-0.8.5-debug-apk
          path: CTP321AndroidStarter_0.7.0/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Run J7 format draft regression tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
